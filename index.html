<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lets Chat - Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-body: #0b0f19; --bg-sidebar: #111827; --bg-chat: #1f2937;
    --primary: #6366f1; --primary-hover: #4f46e5;
    --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
    --text-main: #f3f4f6; --text-muted: #9ca3af; --border: #374151;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg-body); color: var(--text-main); height: 100dvh; overflow: hidden; }

  /* Auth */
  #authPage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: var(--bg-body); z-index: 1000; }
  .auth-box { background: var(--bg-sidebar); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid var(--border); text-align: center; }
  .auth-box h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 30px; font-weight: 700; }
  .auth-tabs { display: flex; background: var(--bg-body); border-radius: 10px; padding: 5px; margin-bottom: 20px; }
  .auth-tabs button { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; border-radius: 8px; transition: 0.3s; }
  .auth-tabs button.active { background: var(--primary); color: white; }
  .auth-box input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none; font-size: 1rem; }
  .auth-box .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .auth-msg { color: var(--danger); font-size: 0.9rem; margin-top: 10px; min-height: 20px; }

  /* App Layout */
  #mainPage { display: none; height: 100dvh; width: 100%; }
  #layout { display: flex; height: 100%; width: 100%; position: relative; }
  #sidebar { width: 340px; background: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; z-index: 100; }
  .sidebar-top { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .app-logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; color: white; flex-shrink: 0; }
  .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.4rem; padding: 5px; }
  .icon-btn:hover { color: var(--text-main); }

  .sidebar-actions { padding: 15px; display: flex; gap: 10px; }
  .sidebar-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; color: white; display: flex; justify-content: center; align-items: center; gap: 5px; transition: 0.2s; }
  .btn-add-friend { background: var(--primary); }
  .btn-add-group { background: var(--success); }

  .section-title { padding: 15px 20px 5px; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: var(--danger); color: white; font-size: 0.7rem; font-weight: bold; padding: 2px 7px; border-radius: 10px; }
  .list-scroll { flex-grow: 1; overflow-y: auto; padding: 0 10px 10px; }
  
  .contact-item { padding: 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; margin-bottom: 5px; }
  .contact-item:hover { background: var(--bg-chat); }
  .contact-item.active { background: var(--primary); color: white; }
  .contact-item .info { flex-grow: 1; min-width: 0; }
  .contact-item .info .name { font-weight: 600; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact-item .info .status { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

  /* Chat Area */
  #chatArea { flex-grow: 1; display: flex; flex-direction: column; background: var(--bg-chat); min-width: 0; }
  #chatHeader { padding: 20px; background: var(--bg-chat); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
  #menuBtn { display: none; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
  #chatTitle { font-size: 1.2rem; font-weight: 700; }
  #chatSubtitle { font-size: 0.85rem; color: var(--text-muted); }

  #welcomeScreen { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); }
  #chatBox { display: none; flex-grow: 1; flex-direction: column; min-height: 0; }
  #messagesArea { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  
  .message-row { display: flex; gap: 15px; max-width: 85%; }
  .message-row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .message-bubble { background: var(--bg-sidebar); padding: 12px 16px; border-radius: 16px; border-top-right-radius: 4px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
  .message-row.mine .message-bubble { background: var(--primary); border-top-right-radius: 16px; border-top-left-radius: 4px; }
  .message-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; font-size: 0.8rem; }
  .message-bubble img, .message-bubble video { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; background: #000; }

  #inputArea { padding: 15px 20px; background: var(--bg-chat); }
  .input-wrapper { background: var(--bg-sidebar); border-radius: 14px; display: flex; align-items: center; padding: 0 15px; border: 1px solid var(--border); }
  .input-wrapper input[type="text"] { flex-grow: 1; padding: 15px 0; border: none; background: transparent; color: var(--text-main); outline: none; font-size: 1rem; }
  .input-wrapper .icon-btn { font-size: 1.5rem; }
  .input-wrapper .send-btn { background: var(--primary); border: none; color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-right: 10px; }

  /* Modals */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
  .modal-box { background: var(--bg-sidebar); width: 100%; max-width: 500px; border-radius: 16px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid var(--border); max-height: 90vh; display: flex; flex-direction: column; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h2 { font-size: 1.3rem; color: white; }
  .modal-box input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none; }
  .modal-box .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

  .users-list { max-height: 300px; overflow-y: auto; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 10px; padding: 5px; }
  .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; }
  .user-row:hover { background: var(--bg-body); }
  .btn-send-req { background: var(--primary); color: white; padding: 6px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }

  /* Settings & Files List */
  .settings-section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
  .settings-section h3 { font-size: 1.1rem; margin-bottom: 10px; color: var(--text-main); }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .toggle-switch { position: relative; display: inline-block; width: 50px; height: 28px; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--border); transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--success); }
  input:checked + .slider:before { transform: translateX(22px); }

  .file-list { flex-grow: 1; overflow-y: auto; max-height: 250px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; }
  .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); }
  .file-item:last-child { border-bottom: none; }
  .file-name { font-size: 0.9rem; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
  .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  .btn-danger:hover { opacity: 0.9; }
  .btn-delete-all { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-bottom: 10px; }

  @media (max-width: 768px) {
    #sidebar { position: absolute; top: 0; right: 0; height: 100%; width: 85%; max-width: 340px; transform: translateX(100%); box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
    #sidebar.open { transform: translateX(0); }
    #menuBtn { display: block; }
  }
</style>
</head>
<body>

<!-- Auth -->
<div id="authPage">
  <div class="auth-box">
    <h1>Lets Chat</h1>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">دخول</button>
      <button id="tabSignup" onclick="switchAuthTab('signup')">حساب جديد</button>
    </div>
    <input type="text" id="authUser" placeholder="اسم المستخدم" maxlength="20">
    <input type="password" id="authPass" placeholder="كلمة المرور" onkeypress="if(event.key==='Enter') doAuth()">
    <button class="submit-btn" id="authSubmitBtn" onclick="doAuth()">دخول</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- App -->
<div id="mainPage">
  <div id="layout">
    <div id="sidebar">
      <div class="sidebar-top">
        <span class="app-logo">Lets Chat</span>
        <div class="user-info">
          <div class="avatar" id="myAvatar"></div>
          <button class="icon-btn" onclick="openSettings()" title="الإعدادات">⚙️</button>
          <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
        </div>
      </div>
      
      <div class="sidebar-actions">
        <button class="btn-add-friend" onclick="openAddFriendModal()">➕ صديق</button>
        <button class="btn-add-group" onclick="openCreateGroupModal()">➕ مجموعة</button>
      </div>
      
      <div class="section-title"><span>الطلبات</span><span class="badge" id="reqBadge" style="display:none;">0</span></div>
      <div id="requestsList" class="list-scroll" style="flex-grow: 0; max-height: 25%;"></div>

      <div class="section-title">الأصدقاء</div>
      <div id="friendsList" class="list-scroll"></div>

      <div class="section-title">المجموعات</div>
      <div id="groupsList" class="list-scroll"></div>
    </div>

    <div id="chatArea">
      <div id="chatHeader">
        <button id="menuBtn" onclick="toggleSidebar()">☰</button>
        <div>
          <div id="chatTitle">اختر محادثة</div>
          <div id="chatSubtitle"></div>
        </div>
      </div>
      
      <div id="welcomeScreen">
        <h1>أهلاً بك 👋</h1>
        <p>اختر صديقاً لبدء الدردشة وإرسال الملفات</p>
      </div>
      
      <div id="chatBox">
        <div id="messagesArea"></div>
        <div id="inputArea">
          <div class="input-wrapper">
            <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(this)">
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="إرسال ملف">📎</button>
            <input type="text" id="msgInput" placeholder="اكتب رسالتك..." maxlength="2000" onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">إرسال</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="addFriendModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h2>إضافة صديق</h2><button class="icon-btn" onclick="closeModal('addFriendModal')">×</button></div>
    <input type="text" id="searchUsersInput" placeholder="ابحث بالاسم..." oninput="filterUsersList()">
    <div id="allUsersList" class="users-list"></div>
  </div>
</div>

<div id="createGroupModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h2>إنشاء مجموعة</h2><button class="icon-btn" onclick="closeModal('createGroupModal')">×</button></div>
    <input type="text" id="groupNameInput" placeholder="اسم المجموعة">
    <div id="groupFriendsChecklist" class="users-list"></div>
    <button class="submit-btn" onclick="createGroup()">إنشاء</button>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h2>الإعدادات</h2><button class="icon-btn" onclick="closeModal('settingsModal')">×</button></div>
    
    <div class="settings-section">
      <h3>التفضيلات</h3>
      <div class="toggle-row">
        <span>قبول طلبات الصداقة تلقائياً</span>
        <label class="toggle-switch">
          <input type="checkbox" id="autoAcceptToggle" onchange="toggleAutoAccept(this)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="settings-section" style="border:none; padding-bottom:0;">
      <h3>الملفات المحملة على متصفحك</h3>
      <button class="btn-delete-all" onclick="deleteAllLocalFiles()">حذف الكل 🗑️</button>
      <div id="localFilesList" class="file-list"></div>
    </div>
  </div>
</div>

<!-- File Download Progress Modal -->
<div id="p2pModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h2>استلام ملف...</h2></div>
    <div style="text-align:center; padding:20px;">
      <div id="p2pStatus" style="margin-bottom:15px;">جارٍ التحميل...</div>
      <progress id="p2pProgress" value="0" max="100" style="width:100%; height:20px;"></progress>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://uongzuhnpngcrulvptuw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OIrvN5pAF8oCJkOEn4uucQ_DzuNQJQh';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const bcryptLib = typeof bcrypt !== 'undefined' ? bcrypt : dcodeIO.bcrypt;

let currentUser = null, currentChatId = null, currentChatType = null;
let renderedMsgIds = new Set();
let friendsCache = [], groupsCache = [], requestsCache = [];
let presenceChan = null;
let globalChannel = null;
let allUsersCache = [];

// ================== Helpers ==================
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar() { if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open'); }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function getAvatarColor(name) {
  const colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
  let hash = 0; for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}
function makeRoom(a, b) { return [a, b].sort().join('__'); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return String(s).replace(/'/g, "\\'"); }
function genUUID() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

// ================== Auth ==================
let authMode = 'login';
function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
  document.getElementById('authSubmitBtn').textContent = mode === 'login' ? 'دخول' : 'إنشاء حساب';
  document.getElementById('authMsg').textContent = '';
}

async function doAuth() {
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const msgEl = document.getElementById('authMsg');
  msgEl.textContent = '...';
  if (!username || password.length < 4) return msgEl.textContent = 'أكمل البيانات';
  try {
    if (authMode === 'signup') {
      const { data: exists } = await sb.from('site_users').select('id').eq('username', username).maybeSingle();
      if (exists) return msgEl.textContent = 'الاسم محجوز';
      const hash = bcryptLib.hashSync(password, bcryptLib.genSaltSync(10));
      const { data, error } = await sb.from('site_users').insert({ username, password_hash: hash, role: 'user' }).select().single();
      if (error) throw error;
      currentUser = { id: data.id, username: data.username };
      localStorage.setItem('chat_user', JSON.stringify(currentUser));
      initApp();
    } else {
      const { data: user } = await sb.from('site_users').select('*').eq('username', username).maybeSingle();
      if (!user || !bcryptLib.compareSync(password, user.password_hash)) return msgEl.textContent = 'بيانات خاطئة';
      currentUser = { id: user.id, username: user.username };
      localStorage.setItem('chat_user', JSON.stringify(currentUser));
      initApp();
    }
  } catch (e) { msgEl.textContent = e.message; }
}
function logout() { localStorage.removeItem('chat_user'); location.reload(); }

// ================== Init ==================
async function initApp() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  const av = document.getElementById('myAvatar');
  av.textContent = currentUser.username[0].toUpperCase();
  av.style.background = getAvatarColor(currentUser.username);

  if (localStorage.getItem('auto_accept') === 'true') {
    document.getElementById('autoAcceptToggle').checked = true;
  }

  presenceChan = sb.channel('presence_room', { config: { presence: { key: currentUser.id } } });
  presenceChan.on('presence', { event: 'sync' }, () => renderFriendsList());
  await presenceChan.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') await presenceChan.track({ username: currentUser.username });
  });

  // الاستماع للتحديثات (لحظة انتهاء الرفع)
  globalChannel = sb.channel('global_msgs')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => onNewMessage(payload.new))
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, (payload) => onUpdateMessage(payload.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'friendships' }, (payload) => onNewFriendRequest(payload.new))
    .subscribe();

  await loadAllData();
  autoDownloadOfflineFiles();
}

// ================== Data Loading ==================
async function loadAllData() {
  try {
    const { data: fr, error: frError } = await sb.from('friendships')
      .select('*, sender:site_users!sender_id(username), receiver:site_users!receiver_id(username)')
      .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);
    
    if (frError) console.error("خطأ في جلب الأصدقاء:", frError);

    const accepted = (fr || []).filter(f => f.status === 'accepted');
    requestsCache = (fr || []).filter(f => f.status === 'pending' && f.receiver_id === currentUser.id);
    
    friendsCache = accepted.map(f => f.sender_id === currentUser.id ? { id: f.receiver_id, username: f.receiver?.username || 'مستخدم' } : { id: f.sender_id, username: f.sender?.username || 'مستخدم' });

    const { data: mems, error: memsError } = await sb.from('group_members').select('group_id').eq('user_id', currentUser.id);
    if (memsError) console.error("خطأ في جلب مجموعات المستخدم:", memsError);
    
    if (mems && mems.length > 0) {
      const { data: grps, error: grpsError } = await sb.from('groups').select('*').in('id', mems.map(m => m.group_id));
      if (grpsError) console.error("خطأ في جلب بيانات المجموعات:", grpsError);
      groupsCache = grps || [];
    } else { groupsCache = []; }

    renderRequests(); 
    renderFriendsList(); 
    renderGroupsList();

  } catch (err) {
    console.error("خطأ غير متوقع في تحميل البيانات:", err);
  }
}

function renderRequests() {
  const container = document.getElementById('requestsList');
  const badge = document.getElementById('reqBadge');
  if (requestsCache.length === 0) {
    container.innerHTML = '<div style="padding:10px; color:var(--text-muted); font-size:0.85rem;">لا توجد طلبات</div>';
    badge.style.display = 'none';
    return;
  }
  badge.style.display = 'inline-block';
  badge.textContent = requestsCache.length;
  container.innerHTML = requestsCache.map(r => `
    <div class="contact-item" style="cursor:default;">
      <div class="avatar" style="background:${getAvatarColor(r.sender?.username || 'U')}">${(r.sender?.username || 'U')[0].toUpperCase()}</div>
      <div class="info"><div class="name">${esc(r.sender?.username || 'مستخدم')}</div></div>
      <div style="display:flex; gap:5px;">
        <button onclick="acceptReq('${r.id}')" style="background:var(--success);color:white;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;">قبول</button>
        <button onclick="rejectReq('${r.id}')" style="background:var(--danger);color:white;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;">رفض</button>
      </div>
    </div>
  `).join('');
}

function renderFriendsList() {
  const onlineIds = new Set(Object.keys(presenceChan.presenceState()));
  const container = document.getElementById('friendsList');
  if (friendsCache.length === 0) {
    container.innerHTML = '<div style="padding:10px; color:var(--text-muted); font-size:0.85rem;">لا يوجد أصدقاء</div>';
    return;
  }
  container.innerHTML = friendsCache.map(f => {
    const online = onlineIds.has(f.id);
    const active = (currentChatId === f.id && currentChatType === 'dm') ? 'active' : '';
    return `<div class="contact-item ${active}" onclick="openChat('${f.id}', '${escAttr(f.username)}', 'dm')">
      <div class="avatar" style="background:${getAvatarColor(f.username)}">${esc(f.username[0].toUpperCase())}</div>
      <div class="info">
        <div class="name">${esc(f.username)}</div>
        <div class="status">${online ? '● متصل' : '○ غير متصل'}</div>
      </div>
    </div>`;
  }).join('');
}

function renderGroupsList() {
  const container = document.getElementById('groupsList');
  if (groupsCache.length === 0) {
    container.innerHTML = '<div style="padding:10px; color:var(--text-muted); font-size:0.85rem;">لا توجد مجموعات</div>';
    return;
  }
  container.innerHTML = groupsCache.map(g => {
    const active = (currentChatId === g.id && currentChatType === 'group') ? 'active' : '';
    return `<div class="contact-item ${active}" onclick="openChat('${g.id}', '${escAttr(g.name)}', 'group')">
      <div class="avatar" style="background:#475569; border-radius:8px;">#</div>
      <div class="info"><div class="name">${esc(g.name)}</div></div>
    </div>`;
  }).join('');
}

// ================== Friends Logic ==================
async function openAddFriendModal() {
  document.getElementById('searchUsersInput').value = '';
  document.getElementById('allUsersList').innerHTML = '<div style="padding:10px; text-align:center;">جارٍ التحميل...</div>';
  openModal('addFriendModal');
  const { data: users } = await sb.from('site_users').select('id, username').neq('id', currentUser.id).order('username');
  allUsersCache = users || [];
  filterUsersList();
}
function filterUsersList() {
  const q = document.getElementById('searchUsersInput').value.trim().toLowerCase();
  const filtered = allUsersCache.filter(u => u.username.toLowerCase().includes(q));
  if (filtered.length === 0) return document.getElementById('allUsersList').innerHTML = '<div style="text-align:center; padding:10px;">لا توجد نتائج</div>';
  document.getElementById('allUsersList').innerHTML = filtered.map(u => {
    const isFriend = friendsCache.some(f => f.id === u.id);
    let btn = isFriend ? `<span style="color:var(--text-muted);">صديق</span>` : `<button class="btn-send-req" onclick="sendFriendReq('${u.id}')">إضافة</button>`;
    return `<div class="user-row"><div style="display:flex; align-items:center; gap:10px;"><div class="avatar" style="width:30px;height:30px;font-size:0.9rem;background:${getAvatarColor(u.username)}">${esc(u.username[0])}</div><span>${esc(u.username)}</span></div>${btn}</div>`;
  }).join('');
}
async function sendFriendReq(receiverId) {
  const { error } = await sb.from('friendships').insert({ sender_id: currentUser.id, receiver_id: receiverId, status: 'pending' });
  if (error) return alert(error.message);
  alert("تم إرسال الطلب!"); closeModal('addFriendModal');
}
async function acceptReq(id) { await sb.from('friendships').update({ status: 'accepted' }).eq('id', id); await loadAllData(); }
async function rejectReq(id) { await sb.from('friendships').delete().eq('id', id); await loadAllData(); }

function onNewFriendRequest(payload) {
  if (payload.receiver_id === currentUser.id) {
    if (localStorage.getItem('auto_accept') === 'true') {
      sb.from('friendships').update({ status: 'accepted' }).eq('id', payload.id).then(() => loadAllData());
    } else {
      loadAllData();
    }
  }
}

// ================== Groups ==================
function openCreateGroupModal() {
  document.getElementById('groupNameInput').value = '';
  const container = document.getElementById('groupFriendsChecklist');
  if (friendsCache.length === 0) container.innerHTML = '<div style="padding:5px;">لا يوجد أصدقاء</div>';
  else container.innerHTML = friendsCache.map(f => `<label class="user-row"><input type="checkbox" value="${f.id}"> ${esc(f.username)}</label>`).join('');
  openModal('createGroupModal');
}
async function createGroup() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) return alert("أدخل اسم المجموعة");
  const selectedIds = Array.from(document.querySelectorAll('#groupFriendsChecklist input:checked')).map(c => c.value);
  const { data: grp, error } = await sb.from('groups').insert({ name, created_by: currentUser.id }).select().single();
  if (error) return alert(error.message);
  const members = [currentUser.id, ...selectedIds].map(uid => ({ group_id: grp.id, user_id: uid }));
  await sb.from('group_members').insert(members);
  closeModal('createGroupModal'); await loadAllData(); openChat(grp.id, grp.name, 'group');
}

// ================== Chat Core ==================
async function openChat(id, name, type) {
  currentChatId = id; currentChatType = type;
  renderedMsgIds.clear();
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('chatBox').style.display = 'flex';
  document.getElementById('chatTitle').textContent = name;
  document.getElementById('chatSubtitle').textContent = type === 'group' ? 'مجموعة' : 'محادثة خاصة';
  document.getElementById('messagesArea').innerHTML = '';
  renderFriendsList(); renderGroupsList(); closeSidebar();

  let query = sb.from('messages').select('*').order('created_at');
  if (type === 'group') query = query.eq('group_id', id);
  else query = query.eq('room', makeRoom(currentUser.id, id));

  const { data: msgs } = await query;
  for (const m of (msgs || [])) await renderMsg(m);
  if (type === 'dm') await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('room', makeRoom(currentUser.id, id)).eq('receiver_id', currentUser.id).is('read_at', null);
  document.getElementById('msgInput').focus();
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  const data = { sender_id: currentUser.id, sender_name: currentUser.username, content: text };
  if (currentChatType === 'group') { data.group_id = currentChatId; data.room = currentChatId; }
  else { data.receiver_id = currentChatId; data.room = makeRoom(currentUser.id, currentChatId); }
  const { data: inserted, error } = await sb.from('messages').insert(data).select().single();
  if (error) return alert(error.message);
  await renderMsg(inserted); input.value = '';
}

async function onNewMessage(m) {
  const isForMe = (currentChatType === 'group' && m.group_id === currentChatId) || (currentChatType === 'dm' && m.room === makeRoom(currentUser.id, currentChatId));
  
  // إذا كان الملف مجزأ ولم ينتهِ رفعه بعد
  if (m.is_chunked && m.is_uploading && m.sender_id !== currentUser.id) {
    if (isForMe) await renderMsg(m); // عرض "جارٍ الرفع..."
    return; 
  }
  
  if (isForMe) await renderMsg(m);
}

async function onUpdateMessage(m) {
  // إذا انتهى المرسل من رفع الأجزاء، نبدأ التحميل فوراً
  if (m.is_chunked && !m.is_uploading && !m.is_downloaded && m.sender_id !== currentUser.id) {
    await downloadChunkedFile(m);
  }
}

async function renderMsg(m) {
  if (renderedMsgIds.has(m.id)) return;
  renderedMsgIds.add(m.id);

  const isMine = m.sender_id === currentUser.id;
  const el = document.createElement('div');
  el.className = `message-row ${isMine ? 'mine' : ''}`;
  
  let content = esc(m.content || '');

  if (m.is_chunked) {
    let localBlob = await idbKeyval.get(m.file_name);
    if (localBlob) {
      const mediaUrl = URL.createObjectURL(localBlob);
      if (m.file_type.startsWith('image/')) content += `<br><img src="${mediaUrl}" loading="lazy">`;
      else if (m.file_type.startsWith('video/')) content += `<br><video src="${mediaUrl}" controls playsinline></video>`;
      else content += `<br><a href="${mediaUrl}" target="_blank" download>📄 تحميل الملف (${esc(m.file_name)})</a>`;
    } else if (m.is_uploading) {
      content += `<br><span style="color:var(--warning);">⏳ جارٍ رفع الملف...</span>`;
    } else {
      content += `<br><span style="color:var(--warning);">⏳ جارٍ استلام الملف...</span>`;
    }
  } else if (m.file_url) {
    let localBlob = await idbKeyval.get(m.file_name);
    let mediaUrl = m.file_url;
    if (localBlob) mediaUrl = URL.createObjectURL(localBlob);

    if (m.file_type.startsWith('image/')) content += `<br><img src="${mediaUrl}" loading="lazy">`;
    else if (m.file_type.startsWith('video/')) content += `<br><video src="${mediaUrl}" controls playsinline></video>`;
    else content += `<br><a href="${mediaUrl}" target="_blank" download>📄 تحميل الملف (${esc(m.file_name)})</a>`;
  }

  const time = new Date(m.created_at).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
  el.innerHTML = `
    <div class="avatar" style="width:35px;height:35px;background:${getAvatarColor(m.sender_name)}">${esc(m.sender_name[0].toUpperCase())}</div>
    <div>
      <div class="message-header"><span class="author">${esc(m.sender_name)} ${isMine ? '(أنت)' : ''}</span><span class="time">${time}</span></div>
      <div class="message-bubble">${content}</div>
    </div>
  `;
  const box = document.getElementById('messagesArea');
  box.appendChild(el); box.scrollTop = box.scrollHeight;
}

// ================== Chunked File Handling (Fast & Responsive) ==================
async function handleFileSelect(input) {
  const file = input.files[0];
  if (!file || !currentChatId || currentChatType !== 'dm') {
    if (currentChatType === 'group') alert("إرسال الملفات مدعوم فقط في المحادثات الفردية حالياً.");
    return;
  }
  input.value = '';
  
  const peerId = currentChatId;
  const onlineIds = new Set(Object.keys(presenceChan.presenceState()));
  const isPeerOnline = onlineIds.has(peerId);

  if (isPeerOnline) {
    uploadChunkedFile(file, peerId);
  } else {
    if (file.size > 20 * 1024 * 1024) {
      return alert("المستخدم غير متصل. الحد الأقصى لإرسال ملف له وهو غير متصل هو 20 ميجابايت.");
    }
    uploadSingleFile(file, peerId);
  }
}

// 1. رفع ملف صغير (للمستخدمين غير المتصلين)
async function uploadSingleFile(file, peerId) {
  const msgInput = document.getElementById('msgInput');
  let originalPlaceholder = msgInput.placeholder;
  msgInput.placeholder = "جارٍ رفع الملف...";
  msgInput.disabled = true;

  try {
    await idbKeyval.set(file.name, file);

    const filePath = `${currentUser.id}_${Date.now()}_${file.name}`;
    const { error: uploadErr } = await sb.storage.from('chat_files').upload(filePath, file);
    if (uploadErr) throw uploadErr;

    const { data: urlData } = sb.storage.from('chat_files').getPublicUrl(filePath);
    
    const data = { 
      sender_id: currentUser.id, sender_name: currentUser.username, 
      content: '', file_url: urlData.publicUrl, file_type: file.type, file_name: file.name,
      receiver_id: peerId, room: makeRoom(currentUser.id, peerId),
      is_chunked: false, is_downloaded: false
    };

    const { data: inserted, error } = await sb.from('messages').insert(data).select().single();
    if (error) throw error;
    await renderMsg(inserted);
  } catch (e) {
    alert("فشل الرفع: " + e.message);
  } finally {
    msgInput.placeholder = originalPlaceholder;
    msgInput.disabled = false;
  }
}

// 2. رفع ملف كبير (تقسيم لأجزاء 20 ميجا) بسرعة وبدون تعليق
async function uploadChunkedFile(file, peerId) {
  const chunkSize = 20 * 1024 * 1024; 
  const totalChunks = Math.ceil(file.size / chunkSize);
  const uploadId = genUUID();
  
  const msgInput = document.getElementById('msgInput');
  let originalPlaceholder = msgInput.placeholder;
  msgInput.disabled = true;

  try {
    // 1. إرسال إشعار فوري للطرف الآخر
    const data = { 
      sender_id: currentUser.id, sender_name: currentUser.username, 
      content: '', file_url: uploadId, file_type: file.type, file_name: file.name,
      receiver_id: peerId, room: makeRoom(currentUser.id, peerId),
      is_chunked: true, total_chunks: totalChunks, is_downloaded: false, is_uploading: true
    };
    const { data: inserted, error: dbErr } = await sb.from('messages').insert(data).select().single();
    if (dbErr) throw dbErr;
    await renderMsg(inserted);

    // 2. الرفع بدفعات (5 أجزاء معاً) لتجنب التعليق
    const BATCH_SIZE = 5;
    for (let i = 0; i < totalChunks; i += BATCH_SIZE) {
      const batch = [];
      for (let j = i; j < Math.min(i + BATCH_SIZE, totalChunks); j++) {
        const start = j * chunkSize;
        const end = Math.min(start + chunkSize, file.size);
        const chunk = file.slice(start, end);
        const path = `chunks/${uploadId}/${j}`;
        
        batch.push(sb.storage.from('chat_files').upload(path, chunk, { upsert: true }).then(res => {
          if (res.error) throw res.error;
          return res;
        }));
      }
      
      await Promise.all(batch);
      msgInput.placeholder = `جارٍ رفع الأجزاء (${Math.min(i + BATCH_SIZE, totalChunks)}/${totalChunks})...`;
    }
    
    // 3. إعلام الطرف الآخر بانتهاء الرفع ليبدأ التحميل فوراً
    await sb.from('messages').update({ is_uploading: false }).eq('id', inserted.id);
    await idbKeyval.set(file.name, file); 
    
  } catch (e) {
    alert("فشل الرفع: " + e.message);
  } finally {
    msgInput.placeholder = originalPlaceholder;
    msgInput.disabled = false;
  }
}

// 3. تحميل الملف المجزأ (للمستقبل) بسرعة
async function downloadChunkedFile(m) {
  const totalChunks = m.total_chunks;
  
  openModal('p2pModal');
  document.getElementById('p2pStatus').textContent = `جارٍ تحميل الأجزاء...`;
  document.getElementById('p2pProgress').value = 0;

  try {
    const chunks = [];
    const BATCH_SIZE = 5; // تحميل 5 أجزاء معاً
    
    for (let i = 0; i < totalChunks; i += BATCH_SIZE) {
      const batch = [];
      for (let j = i; j < Math.min(i + BATCH_SIZE, totalChunks); j++) {
        const path = `chunks/${m.file_url}/${j}`;
        batch.push(sb.storage.from('chat_files').download(path).then(res => {
          if (res.error) throw res.error;
          return res.data;
        }));
      }
      
      const results = await Promise.all(batch);
      chunks.push(...results);
      
      document.getElementById('p2pProgress').value = (Math.min(i + BATCH_SIZE, totalChunks) / totalChunks) * 100;
      document.getElementById('p2pStatus').textContent = `تم تحميل ${Math.min(i + BATCH_SIZE, totalChunks)} من ${totalChunks}...`;
    }
    
    const blob = new Blob(chunks, { type: m.file_type });
    await idbKeyval.set(m.file_name, blob);
    
    // مسح الأجزاء من السيرفر فوراً
    const filesToRemove = Array.from({ length: totalChunks }, (_, i) => `chunks/${m.file_url}/${i}`);
    await sb.storage.from('chat_files').remove(filesToRemove);
    await sb.from('messages').update({ is_downloaded: true }).eq('id', m.id);
    
    closeModal('p2pModal');
    
    // تحديث الدردشة
    if ((currentChatType === 'dm' && m.sender_id === currentChatId) || (currentChatType === 'group' && m.group_id === currentChatId)) {
      document.getElementById('messagesArea').innerHTML = '';
      renderedMsgIds.clear();
      openChat(currentChatId, document.getElementById('chatTitle').textContent, currentChatType);
    }
    
  } catch (e) {
    console.error(e);
    alert("فشل التحميل: " + e.message);
    closeModal('p2pModal');
  }
}

// 4. التحميل التلقائي للملفات عند الدخول
async function autoDownloadOfflineFiles() {
  const { data: msgs } = await sb.from('messages').select('*')
    .eq('receiver_id', currentUser.id)
    .eq('is_downloaded', false)
    .not('file_url', 'is', null);

  if (!msgs || msgs.length === 0) return;

  for (const m of msgs) {
    if (m.is_chunked) {
      if (!m.is_uploading) await downloadChunkedFile(m); 
    } else {
      try {
        const res = await fetch(m.file_url);
        const blob = await res.blob();
        await idbKeyval.set(m.file_name, blob);
        await sb.from('messages').update({ is_downloaded: true }).eq('id', m.id);
        
        const filePath = m.file_url.split('/chat_files/')[1];
        if (filePath) await sb.storage.from('chat_files').remove([decodeURIComponent(filePath)]);
      } catch (err) { console.error("Auto-download failed:", err); }
    }
  }
}

// ================== Settings & Local Files ==================
function openSettings() { openModal('settingsModal'); renderLocalFiles(); }
function toggleAutoAccept(el) { localStorage.setItem('auto_accept', el.checked); }

async function renderLocalFiles() {
  const list = document.getElementById('localFilesList');
  list.innerHTML = '<div style="text-align:center; padding:10px;">جارٍ التحميل...</div>';
  try {
    const keys = await idbKeyval.keys();
    if (keys.length === 0) return list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد ملفات.</div>';
    list.innerHTML = keys.map(k => `
      <div class="file-item">
        <span class="file-name">${esc(k)}</span>
        <button class="btn-danger" onclick="deleteSingleFile('${esc(k)}')">حذف</button>
      </div>
    `).join('');
  } catch (e) { list.innerHTML = '<div style="color:var(--danger); text-align:center;">خطأ</div>'; }
}

async function deleteSingleFile(key) {
  if (!confirm("حذف هذا الملف من متصفحك؟")) return;
  await idbKeyval.del(key);
  renderLocalFiles();
}

async function deleteAllLocalFiles() {
  if (!confirm("حذف جميع الملفات المحملة؟")) return;
  await idbKeyval.clear();
  renderLocalFiles();
  alert("تم حذف جميع الملفات.");
}

// ================== Boot ==================
(function boot() {
  const saved = localStorage.getItem('chat_user');
  if (saved) {
    try { currentUser = JSON.parse(saved); if (currentUser?.id) initApp(); } catch(e) { localStorage.removeItem('chat_user'); }
  }
})();
</script>
