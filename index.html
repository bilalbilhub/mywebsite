<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة متطورة (مكالمات تعمل)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #1e1e2e; color: #cdd6f4; height: 100vh; overflow: hidden; }

  #authPage { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; padding: 20px; background: #1e1e2e; z-index: 100; }
  #authPage h1 { color: #89b4fa; margin-bottom: 10px; }
  .tabs { display: flex; gap: 0; margin-bottom: 10px; background: #181825; border-radius: 8px; overflow: hidden; }
  .tabs button { padding: 10px 24px; background: transparent; border: none; color: #a6adc8; cursor: pointer; font-size: 0.95rem; }
  .tabs button.active { background: #89b4fa; color: #1e1e2e; font-weight: bold; }
  #authPage input { padding: 12px 16px; width: 280px; border-radius: 8px; border: 1px solid #45475a; background: #313244; color: #cdd6f4; outline: none; text-align: center; }
  #authPage .submit { padding: 12px 32px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
  #authPage .msg { font-size: 0.85rem; color: #f38ba8; min-height: 20px; text-align: center; max-width: 320px; word-wrap: break-word; }

  #mainPage { display: none; height: 100vh; }
  #topbar { height: 54px; background: #181825; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #313244; }
  #topbar .brand { color: #89b4fa; font-weight: bold; }
  #topbar .me { color: #a6adc8; font-size: 0.9rem; }
  #topbar .me b { color: #cdd6f4; }
  #topbar button { background: none; border: 1px solid #45475a; color: #a6adc8; padding: 6px 14px; border-radius: 6px; cursor: pointer; margin-right: 8px; }
  #topbar button:hover { background: #313244; }

  #layout { display: flex; height: calc(100vh - 54px); }
  #sidebar { width: 280px; background: #181825; border-left: 1px solid #313244; display: flex; flex-direction: column; }

  #connectBox { padding: 12px; border-bottom: 1px solid #313244; display: flex; flex-direction: column; gap: 8px; }
  #connectBox .row { display: flex; gap: 6px; }
  #connectBox input { flex-grow: 1; padding: 8px 10px; border: 1px solid #45475a; background: #313244; color: #cdd6f4; border-radius: 6px; outline: none; font-size: 0.9rem; }
  #connectBox button { padding: 8px 14px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  #connectBox .btn-group { background: #a6e3a1; color: #1e1e2e; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; border: none; margin-top: 4px; }

  .section-title { padding: 10px 12px 4px; font-size: 0.75rem; color: #6c7086; font-weight: bold; text-transform: uppercase; }
  #contacts, #groupsList { flex-grow: 0; overflow-y: auto; padding: 0 8px 8px; max-height: 40%; }
  .contact { padding: 10px 12px; margin-bottom: 4px; background: #313244; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .contact:hover { background: #45475a; }
  .contact.active { background: #89b4fa; color: #1e1e2e; }
  .contact.active .status { color: #1e1e2e !important; }
  .contact .info { flex-grow: 1; min-width: 0; }
  .contact .name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact .status { font-size: 0.75rem; margin-top: 2px; color: #6c7086; }
  .contact .badge { background: #f38ba8; color: #1e1e2e; font-size: 0.7rem; font-weight: bold; padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center; }

  #chatArea { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatHeader { padding: 12px 20px; background: #181825; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
  #chatHeader h2 { color: #89b4fa; font-size: 1.05rem; }
  .call-btns { display: flex; gap: 10px; }
  .call-btns button { background: #313244; border: 1px solid #45475a; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
  .call-btns button:hover { background: #45475a; }

  #welcome { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #6c7086; text-align: center; padding: 20px; }
  #welcome h1 { color: #89b4fa; margin-bottom: 10px; font-size: 1.2rem; }

  #chatBox { display: none; flex-grow: 1; flex-direction: column; min-height: 0; }
  #messages { flex-grow: 1; overflow-y: auto; padding: 16px 20px; min-height: 0; }
  .msg { margin-bottom: 12px; max-width: 70%; }
  .msg.mine { margin-left: auto; text-align: left; }
  .msg.theirs { margin-right: auto; text-align: right; }
  .msg .bubble { padding: 10px 14px; border-radius: 14px; word-wrap: break-word; overflow: hidden; }
  .msg.mine .bubble { background: #89b4fa; color: #1e1e2e; border-bottom-left-radius: 4px; }
  .msg.theirs .bubble { background: #313244; color: #cdd6f4; border-bottom-right-radius: 4px; }
  .msg .bubble img, .msg .bubble video { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  .msg .bubble a { color: inherit; text-decoration: underline; display: block; margin-top: 5px; }
  .msg .meta { font-size: 0.7rem; color: #6c7086; margin-top: 3px; padding: 0 4px; }
  .msg.mine .meta { text-align: left; }
  .msg.theirs .meta { text-align: right; }

  #inputBox { display: flex; padding: 12px 20px; background: #181825; border-top: 1px solid #313244; gap: 8px; align-items: center; }
  #inputBox .attach { cursor: pointer; font-size: 1.5rem; color: #a6adc8; padding: 0 5px; }
  #inputBox .attach:hover { color: #89b4fa; }
  #inputBox input[type="text"] { flex-grow: 1; padding: 10px 14px; border: none; border-radius: 8px; background: #313244; color: #cdd6f4; outline: none; }
  #inputBox button { padding: 10px 22px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

  /* شاشة المكالمة */
  #callOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
  #callOverlay h2 { color: white; margin-bottom: 20px; }
  #videoContainer { position: relative; width: 80%; max-width: 800px; height: 60%; background: #000; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
  #localVideo { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 100px; background: #000; border-radius: 8px; object-fit: cover; border: 2px solid #fff; }
  .call-controls { display: flex; gap: 20px; margin-top: 20px; }
  .call-controls button { padding: 15px 30px; border-radius: 30px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
  .btn-end { background: #f38ba8; color: #1e1e2e; }
  .btn-mute { background: #f9e2af; color: #1e1e2e; }
  
  #incomingCallPopup { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #89b4fa; color: #1e1e2e; padding: 15px 30px; border-radius: 12px; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); align-items: center; gap: 20px; font-weight: bold; }
  #incomingCallPopup button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div id="authPage">
  <h1>💬 دردشة متطورة</h1>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchTab('login')">تسجيل دخول</button>
    <button id="tabSignup" onclick="switchTab('signup')">إنشاء حساب</button>
  </div>
  <input type="text" id="authUsername" placeholder="اسم المستخدم" maxlength="20">
  <input type="password" id="authPassword" placeholder="كلمة المرور" onkeypress="if(event.key==='Enter') submitAuth()">
  <button class="submit" id="authBtn" onclick="submitAuth()">دخول</button>
  <div class="msg" id="authMsg"></div>
</div>

<div id="mainPage">
  <div id="topbar">
    <span class="brand">💬 دردشة</span>
    <div>
      <span class="me">أنت: <b id="myNameDisplay"></b></span>
      <button onclick="logout()">خروج</button>
    </div>
  </div>

  <div id="layout">
    <div id="sidebar">
      <div id="connectBox">
        <div class="row">
          <input id="connectInput" placeholder="اسم المستخدم..." onkeypress="if(event.key==='Enter') connect()">
          <button onclick="connect()">اتصال</button>
        </div>
        <button class="btn-group" onclick="createGroup()">➕ إنشاء مجموعة</button>
      </div>
      
      <div class="section-title">المجموعات</div>
      <div id="groupsList"></div>

      <div class="section-title">الأصدقاء</div>
      <div id="contacts"></div>
    </div>

    <div id="chatArea">
      <div id="chatHeader" style="display:none">
        <h2 id="chatTitle"></h2>
        <div class="call-btns" id="callButtons">
          <button onclick="startCall(false)" title="مكالمة صوتية">📞</button>
          <button onclick="startCall(true)" title="مكالمة فيديو">📹</button>
        </div>
      </div>
      <div id="welcome">
        <h1>مرحبًا 👋</h1>
        <p>اختر صديقاً أو مجموعة لبدء الدردشة</p>
      </div>
      <div id="chatBox">
        <div id="messages"></div>
        <div id="inputBox">
          <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(this)">
          <span class="attach" onclick="document.getElementById('fileInput').click()">📎</span>
          <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') send()">
          <button onclick="send()">إرسال</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="callOverlay">
  <h2 id="callStatus">جارٍ الاتصال...</h2>
  <div id="videoContainer">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="call-controls">
    <button class="btn-mute" id="muteBtn" onclick="toggleMute()">🎤 كتم</button>
    <button class="btn-end" onclick="endCall()">❌ إنهاء</button>
  </div>
</div>

<div id="incomingCallPopup">
  <span id="incomingText">📞 مكالمة واردة...</span>
  <button style="background:#a6e3a1;" onclick="acceptCall()">قبول</button>
  <button style="background:#f38ba8;" onclick="rejectCall()">رفض</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://uongzuhnpngcrulvptuw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OIrvN5pAF8oCJkOEn4uucQ_DzuNQJQh';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let bcryptLib = typeof bcrypt !== 'undefined' ? bcrypt : (typeof dcodeIO !== 'undefined' ? dcodeIO.bcrypt : null);

let currentUser = null;
let currentChatId = null; 
let currentChatType = null; 
let currentChatName = '';
let presenceChannel = null;
let globalChannel = null;
let onlineUsers = new Set();
let authMode = 'login';
let renderedIds = new Set();
let myGroups = [];

// ================== AUTH ==================
function switchTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
  document.getElementById('authBtn').textContent = mode === 'login' ? 'دخول' : 'إنشاء حساب';
  document.getElementById('authMsg').textContent = '';
}

async function submitAuth() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const msgEl = document.getElementById('authMsg');
  msgEl.textContent = '...';

  if (!username || password.length < 4) return msgEl.textContent = 'البيانات غير مكتملة';
  if (!bcryptLib) return msgEl.textContent = 'خطأ في تحميل المكتبة';

  try {
    if (authMode === 'signup') {
      const { data: exists } = await sb.from('site_users').select('id').eq('username', username).maybeSingle();
      if (exists) return msgEl.textContent = 'الاسم محجوز';

      const hash = bcryptLib.hashSync(password, bcryptLib.genSaltSync(10));
      const { data, error } = await sb.from('site_users').insert({ username, password_hash: hash, role: 'user' }).select().single();
      if (error) throw new Error(error.message);

      currentUser = { id: data.id, username: data.username };
      localStorage.setItem('chat_user', JSON.stringify(currentUser));
      enterMain();
    } else {
      const { data: user } = await sb.from('site_users').select('*').eq('username', username).maybeSingle();
      if (!user || !bcryptLib.compareSync(password, user.password_hash)) return msgEl.textContent = 'بيانات خاطئة';

      currentUser = { id: user.id, username: user.username };
      localStorage.setItem('chat_user', JSON.stringify(currentUser));
      enterMain();
    }
  } catch (err) { msgEl.textContent = err.message; }
}

function logout() { localStorage.removeItem('chat_user'); location.reload(); }

// ================== MAIN ==================
async function enterMain() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('myNameDisplay').textContent = currentUser.username;

  presenceChannel = sb.channel('presence-lobby', { config: { presence: { key: currentUser.id } } });
  presenceChannel.on('presence', { event: 'sync' }, () => {
    onlineUsers = new Set(Object.keys(presenceChannel.presenceState()));
    refreshSidebar();
  });
  await presenceChannel.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') await presenceChannel.track({ username: currentUser.username });
  });

  globalChannel = sb.channel('my-messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => handleIncoming(payload.new))
    .subscribe();

  listenForIncomingCalls();
  refreshSidebar();
  processPendingFiles();
}

// ================== SIDEBAR & GROUPS ==================
async function refreshSidebar() {
  const { data: members } = await sb.from('group_members').select('group_id').eq('user_id', currentUser.id);
  if (members && members.length > 0) {
    const groupIds = members.map(m => m.group_id);
    const { data: groups } = await sb.from('groups').select('*').in('id', groupIds);
    myGroups = groups || [];
    document.getElementById('groupsList').innerHTML = myGroups.map(g => `
      <div class="contact ${currentChatId === g.id ? 'active' : ''}" onclick="openChat('${g.id}', '${escapeAttr(g.name)}', 'group')">
        <div class="info"><div class="name">${escapeHtml(g.name)}</div></div>
      </div>
    `).join('');
  } else {
    document.getElementById('groupsList').innerHTML = '<div style="padding:10px; color:#6c7086; font-size:0.8rem;">لا توجد مجموعات</div>';
  }

  const { data: msgs } = await sb.from('messages').select('sender_id, receiver_id').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);
  const peerIds = new Set();
  (msgs || []).forEach(m => {
    if (m.sender_id !== currentUser.id) peerIds.add(m.sender_id);
    if (m.receiver_id && m.receiver_id !== currentUser.id) peerIds.add(m.receiver_id);
  });
  onlineUsers.forEach(id => { if (id !== currentUser.id) peerIds.add(id); });

  if (peerIds.size === 0) {
    document.getElementById('contacts').innerHTML = '<div style="padding:10px; color:#6c7086; font-size:0.8rem;">لا يوجد أصدقاء</div>';
    return;
  }

  const { data: profiles } = await sb.from('site_users').select('id, username').in('id', Array.from(peerIds));
  const { data: unread } = await sb.from('messages').select('sender_id').eq('receiver_id', currentUser.id).is('read_at', null);
  const unreadCount = {};
  (unread || []).forEach(m => unreadCount[m.sender_id] = (unreadCount[m.sender_id] || 0) + 1);

  document.getElementById('contacts').innerHTML = (profiles || []).sort((a,b)=>a.username.localeCompare(b.username)).map(p => {
    const online = onlineUsers.has(p.id);
    const active = currentChatId === p.id ? 'active' : '';
    const badge = unreadCount[p.id] ? `<span class="badge">${unreadCount[p.id]}</span>` : '';
    return `<div class="contact ${active}" onclick="openChat('${p.id}', '${escapeAttr(p.username)}', 'dm')">
      <div class="info"><div class="name">${escapeHtml(p.username)}</div><div class="status" style="color:${online?'#a6e3a1':'#6c7086'}">${online ? '● متصل' : '○ غير متصل'}</div></div>
      ${badge}
    </div>`;
  }).join('');
}

async function createGroup() {
  const name = prompt("اسم المجموعة:");
  if (!name) return;
  const membersStr = prompt("أسماء الأعضاء (مفصولة بفاصلة):");
  if (!membersStr) return;

  const usernames = membersStr.split(',').map(s => s.trim()).filter(s => s);
  usernames.push(currentUser.username);

  const { data: users } = await sb.from('site_users').select('id, username').in('username', usernames);
  if (!users || users.length === 0) return alert("لم يتم العثور على الأعضاء");

  const { data: group, error } = await sb.from('groups').insert({ name, created_by: currentUser.id }).select().single();
  if (error) return alert("خطأ: " + error.message);

  const groupMembers = users.map(u => ({ group_id: group.id, user_id: u.id }));
  await sb.from('group_members').insert(groupMembers);

  alert("تم إنشاء المجموعة!");
  refreshSidebar();
  openChat(group.id, group.name, 'group');
}

async function connect() {
  const username = document.getElementById('connectInput').value.trim();
  if (!username || username === currentUser.username) return;
  const { data: profile } = await sb.from('site_users').select('id, username').eq('username', username).maybeSingle();
  if (!profile) return alert('المستخدم غير موجود');
  document.getElementById('connectInput').value = '';
  openChat(profile.id, profile.username, 'dm');
}

async function openChat(id, name, type) {
  currentChatId = id;
  currentChatType = type;
  currentChatName = name;
  renderedIds.clear();

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('chatBox').style.display = 'flex';
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('chatTitle').textContent = name;
  document.getElementById('messages').innerHTML = '';
  
  document.getElementById('callButtons').style.display = type === 'dm' ? 'flex' : 'none';

  refreshSidebar();

  let query = sb.from('messages').select('*').order('created_at');
  if (type === 'group') {
    query = query.eq('group_id', id);
  } else {
    const room = makeRoom(currentUser.id, id);
    query = query.eq('room', room);
  }

  const { data: msgs } = await query;
  for (const m of (msgs || [])) {
    await renderMessage(m);
  }

  if (type === 'dm') {
    await sb.from('messages').update({ read_at: new Date().toISOString() })
      .eq('room', makeRoom(currentUser.id, id)).eq('receiver_id', currentUser.id).is('read_at', null);
  }
  refreshSidebar();
  document.getElementById('msgInput').focus();
}

// ================== MESSAGES & FILES ==================
async function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;

  const msgData = { sender_id: currentUser.id, sender_name: currentUser.username, content: text };
  if (currentChatType === 'group') {
    msgData.group_id = currentChatId;
    msgData.room = currentChatId;
  } else {
    msgData.receiver_id = currentChatId;
    msgData.room = makeRoom(currentUser.id, currentChatId);
  }

  const { data, error } = await sb.from('messages').insert(msgData).select().single();
  if (error) return alert("فشل الإرسال: " + error.message);
  
  await renderMessage(data);
  input.value = '';
  input.focus();
}

async function handleFileSelect(input) {
  const file = input.files[0];
  if (!file || !currentChatId) return;
  if (file.size > 50 * 1024 * 1024) return alert("الحد الأقصى 50 ميجابايت");

  input.value = ''; 
  const originalName = file.name;
  const safeName = sanitizeFileName(originalName);
  const fileName = `${Date.now()}_${safeName}`;
  const filePath = `${currentChatType}/${currentChatId}/${fileName}`;

  const { error: uploadError } = await sb.storage.from('chat_files').upload(filePath, file);
  if (uploadError) return alert("فشل الرفع: " + uploadError.message);

  const { data: urlData } = sb.storage.from('chat_files').getPublicUrl(filePath);
  const fileUrl = urlData.publicUrl;

  await idbKeyval.set(fileName, file);

  const msgData = { 
    sender_id: currentUser.id, sender_name: currentUser.username, content: '', 
    file_url: fileUrl, file_type: file.type, file_name: fileName, file_original_name: originalName
  };
  if (currentChatType === 'group') {
    msgData.group_id = currentChatId;
    msgData.room = currentChatId;
  } else {
    msgData.receiver_id = currentChatId;
    msgData.room = makeRoom(currentUser.id, currentChatId);
  }

  const { data, error } = await sb.from('messages').insert(msgData).select().single();
  if (error) return alert("فشل حفظ الرسالة: " + error.message);

  await renderMessage(data);
}

async function handleIncoming(m) {
  let isForMe = false;
  if (currentChatType === 'group' && m.group_id === currentChatId) isForMe = true;
  if (currentChatType === 'dm' && m.room === makeRoom(currentUser.id, currentChatId)) isForMe = true;

  if (isForMe) {
    await renderMessage(m);
    if (currentChatType === 'dm' && m.sender_id !== currentUser.id) {
      await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('id', m.id);
    }
  } else {
    refreshSidebar();
  }
}

async function renderMessage(m) {
  if (renderedIds.has(m.id)) return;
  renderedIds.add(m.id);

  const isMine = m.sender_id === currentUser.id;
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ' + (isMine ? 'mine' : 'theirs');
  
  let contentHtml = escapeHtml(m.content || '');
  
  if (m.file_url && m.file_name) {
    let localBlob = await idbKeyval.get(m.file_name);
    if (localBlob) {
      const objectUrl = URL.createObjectURL(localBlob);
      contentHtml += renderMedia(objectUrl, m.file_type, m.file_name, m.file_original_name);
    } else {
      const displayName = m.file_original_name || 'ملف';
      contentHtml += `<a href="${m.file_url}" target="_blank" download>⬇️ تحميل الملف (${displayName})</a>`;
      downloadAndSaveFile(m.file_url, m.file_name, m.file_type, m.file_original_name, el);
    }
  }

  el.innerHTML = `
    <div class="bubble">${contentHtml}</div>
    <div class="meta">${escapeHtml(m.sender_name)}</div>
  `;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function renderMedia(url, type, name, originalName) {
  const displayName = originalName || (name ? name.split('_').slice(1).join('_') : 'ملف');
  if (type && type.startsWith('image/')) return `<img src="${url}" alt="${displayName}">`;
  if (type && type.startsWith('video/')) return `<video src="${url}" controls></video>`;
  return `<a href="${url}" target="_blank" download>📄 ${displayName}</a>`;
}

function sanitizeFileName(name) {
  const lastDot = name.lastIndexOf('.');
  let base = lastDot !== -1 ? name.substring(0, lastDot) : name;
  let ext = lastDot !== -1 ? name.substring(lastDot + 1) : '';
  base = base.replace(/[^a-zA-Z0-9_-]/g, '_');
  ext = ext.replace(/[^a-zA-Z0-9]/g, '');
  if (!base) base = 'file';
  return ext ? `${base}.${ext}` : base;
}

async function processPendingFiles() {
  const { data: msgs } = await sb.from('messages').select('*').not('file_url', 'is', null);
  if (!msgs) return;
  for (const m of msgs) {
    const exists = await idbKeyval.get(m.file_name);
    if (!exists) await downloadAndSaveFile(m.file_url, m.file_name, m.file_type, m.file_original_name, null);
  }
}

async function downloadAndSaveFile(url, fileName, fileType, originalName, el) {
  try {
    const response = await fetch(url);
    const blob = await response.blob();
    await idbKeyval.set(fileName, blob);

    const filePath = url.split('/chat_files/')[1];
    if (filePath) await sb.storage.from('chat_files').remove([decodeURIComponent(filePath)]);

    if (el) {
      const objectUrl = URL.createObjectURL(blob);
      const bubble = el.querySelector('.bubble');
      const oldLink = bubble.querySelector('a');
      if (oldLink) oldLink.remove();
      bubble.innerHTML += renderMedia(objectUrl, fileType, fileName, originalName);
    }
  } catch (err) { console.error("فشل تحميل الملف: ", err); }
}

// ================== WEBRTC CALLS (FIXED) ==================
let peerConnection = null;
let localStream = null;
let callChannel = null;
let incomingCallData = null;
let isCalling = false;
let isCaller = false;
let iceCandidatesQueue = []; // لحفظ المرشحات لحين اكتمال الاتصال

const rtcConfig = { 
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    // TURN مجاني لضمان نجاح الاتصال في الشبكات المقيدة
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }
  ] 
};

// 1. الاستماع الدائم للمكالمات الواردة
function listenForIncomingCalls() {
  sb.channel(`incoming_calls_${currentUser.id}`)
    .on('broadcast', { event: 'call_offer' }, ({ payload }) => {
      if (isCalling) {
        sb.channel(`incoming_calls_${payload.callerId}`).send({ type: 'broadcast', event: 'call_rejected', payload: {} });
        return;
      }
      incomingCallData = payload;
      document.getElementById('incomingText').textContent = `📞 مكالمة ${payload.isVideo ? 'فيديو' : 'صوتية'} واردة من ${payload.callerName}`;
      document.getElementById('incomingCallPopup').style.display = 'flex';
    })
    .on('broadcast', { event: 'call_rejected' }, () => {
      alert('تم رفض المكالمة.');
      endCall();
    })
    .subscribe();
}

// 2. بدء المكالمة (المتصل)
async function startCall(isVideo) {
  if (isCalling || !currentChatId || currentChatType !== 'dm') return;
  isCalling = true;
  isCaller = true;
  
  showCallUI(isVideo, 'جارٍ الاتصال...');
  if (!await setupMedia(isVideo)) return;

  setupPeerConnection();
  
  const roomId = makeRoom(currentUser.id, currentChatId);
  callChannel = sb.channel(`webrtc_${roomId}`, { config: { broadcast: { self: false } } });
  
  callChannel
    .on('broadcast', { event: 'ready' }, async () => {
      // الطرف الآخر قبل المكالمة وجاهز، نرسل له العرض
      document.getElementById('callStatus').textContent = 'جارٍ التشفير...';
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      callChannel.send({ type: 'broadcast', event: 'offer', payload: { offer } });
    })
    .on('broadcast', { event: 'answer' }, async ({ payload }) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer));
      processIceQueue(); // معالجة المرشحات المعلقة
    })
    .on('broadcast', { event: 'ice-candidate' }, async ({ payload }) => {
      if (payload.candidate) {
        if (peerConnection.remoteDescription) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
        } else {
          iceCandidatesQueue.push(payload.candidate);
        }
      }
    })
    .on('broadcast', { event: 'reject' }, () => {
      alert('تم رفض المكالمة.');
      endCall();
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        // إرسال إشعار للمتلقي
        sb.channel(`incoming_calls_${currentChatId}`).send({
          type: 'broadcast', event: 'call_offer',
          payload: { callerId: currentUser.id, callerName: currentUser.username, isVideo, roomId }
        });
      }
    });
}

// 3. قبول المكالمة (المتلقي)
async function acceptCall() {
  document.getElementById('incomingCallPopup').style.display = 'none';
  if (!incomingCallData) return;
  
  isCalling = true;
  isCaller = false;
  
  showCallUI(incomingCallData.isVideo, 'جارٍ الاتصال...');
  if (!await setupMedia(incomingCallData.isVideo)) return;

  setupPeerConnection();
  
  callChannel = sb.channel(`webrtc_${incomingCallData.roomId}`, { config: { broadcast: { self: false } } });
  
  callChannel
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
      processIceQueue(); // معالجة المرشحات المعلقة
      
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      callChannel.send({ type: 'broadcast', event: 'answer', payload: { answer } });
    })
    .on('broadcast', { event: 'ice-candidate' }, async ({ payload }) => {
      if (payload.candidate) {
        if (peerConnection.remoteDescription) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
        } else {
          iceCandidatesQueue.push(payload.candidate);
        }
      }
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        // إخبار المتصل أننا جاهزون لاستقبال العرض
        callChannel.send({ type: 'broadcast', event: 'ready' });
      }
    });
  
  incomingCallData = null;
}

// 4. الدوال المساعدة للمكالمة
function showCallUI(isVideo, statusText) {
  document.getElementById('callOverlay').style.display = 'flex';
  document.getElementById('callStatus').textContent = statusText;
  document.getElementById('localVideo').style.display = isVideo ? 'block' : 'none';
}

async function setupMedia(isVideo) {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
    document.getElementById('localVideo').srcObject = localStream;
    return true;
  } catch (err) {
    alert('لا يمكن الوصول للكاميرا/الميكروفون: ' + err.message);
    endCall();
    return false;
  }
}

function setupPeerConnection() {
  peerConnection = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

  peerConnection.ontrack = (event) => {
    document.getElementById('remoteVideo').srcObject = event.streams[0];
  };

  peerConnection.onicecandidate = (event) => {
    if (event.candidate && callChannel) {
      callChannel.send({ type: 'broadcast', event: 'ice-candidate', payload: { candidate: event.candidate } });
    }
  };

  peerConnection.oniceconnectionstatechange = () => {
    if (peerConnection.iceConnectionState === 'connected' || peerConnection.iceConnectionState === 'completed') {
      document.getElementById('callStatus').textContent = 'متصل 🟢';
    } else if (peerConnection.iceConnectionState === 'failed' || peerConnection.iceConnectionState === 'disconnected') {
      document.getElementById('callStatus').textContent = 'انقطع الاتصال 🔴';
    }
  };
}

function processIceQueue() {
  iceCandidatesQueue.forEach(async (candidate) => {
    try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){}
  });
  iceCandidatesQueue = [];
}

// 5. إدارة المكالمة
function rejectCall() {
  if (incomingCallData) {
    sb.channel(`incoming_calls_${incomingCallData.callerId}`).send({ type: 'broadcast', event: 'call_rejected', payload: {} });
    incomingCallData = null;
  }
  document.getElementById('incomingCallPopup').style.display = 'none';
}

function toggleMute() {
  if (localStream) {
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      audioTrack.enabled = !audioTrack.enabled;
      document.getElementById('muteBtn').textContent = audioTrack.enabled ? '🎤 كتم' : '🔇 إلغاء الكتم';
    }
  }
}

function endCall() {
  if (callChannel && isCaller) {
    callChannel.send({ type: 'broadcast', event: 'reject', payload: {} });
  }
  
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (callChannel) { sb.removeChannel(callChannel); callChannel = null; }
  
  isCalling = false;
  isCaller = false;
  iceCandidatesQueue = [];
  
  document.getElementById('callOverlay').style.display = 'none';
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  document.getElementById('muteBtn').textContent = '🎤 كتم';
}

// ================== HELPERS ==================
function makeRoom(a, b) { return [a, b].sort().join('__'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

// ================== BOOT ==================
(function boot() {
  const saved = localStorage.getItem('chat_user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      if (currentUser && currentUser.id) enterMain();
    } catch(e) { localStorage.removeItem('chat_user'); }
  }
})();
</script>
